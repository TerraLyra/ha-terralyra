name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  compile:
    name: Python and JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: Validate JSON
        run: |
          while IFS= read -r -d '' file; do
            python -m json.tool "$file" >/dev/null
          done < <(find custom_components/terralyra -type f -name '*.json' -print0)
          python -m json.tool hacs.json >/dev/null


  tests:
    name: Pytest + config-flow coverage
    env:
      PYTHONPATH: ${{ github.workspace }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-test.txt
      - name: Run tests
        run: pytest --cov=custom_components.terralyra.config_flow --cov-report=term-missing --cov-fail-under=100

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Local brand assets work in Home Assistant 2026.3+, but the HACS
          # brands check requires a separate upstream home-assistant/brands PR.
          ignore: brands
