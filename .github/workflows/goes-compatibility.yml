name: GOES compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  decoder:
    name: Python 3.14 / ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Linux x86-64
            runner: ubuntu-24.04
          - architecture: Linux ARM64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-test.txt
      - name: Show native decoder versions
        run: |
          python - <<'PY'
          import platform
          import h5py
          import numpy

          print(f"machine={platform.machine()}")
          print(f"h5py={h5py.__version__}")
          print(f"numpy={numpy.__version__}")
          PY
      - name: Test GOES discovery, download and decoder
        run: pytest -q tests/test_goes_foundation.py tests/test_goes_decoder.py
