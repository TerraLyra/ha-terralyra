name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install security scanners
        run: python -m pip install --disable-pip-version-check bandit pip-audit detect-secrets
      - name: Bandit
        run: bandit -r custom_components -ll -ii
      - name: Audit integration runtime dependencies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("custom_components/terralyra/manifest.json").read_text())
          dependencies = manifest.get("requirements", [])
          Path("/tmp/terralyra-runtime-requirements.txt").write_text(
              "\n".join(dependencies), encoding="utf-8"
          )
          print(f"Runtime dependencies declared by the integration: {len(dependencies)}")
          PY
          if [ -s /tmp/terralyra-runtime-requirements.txt ]; then
            pip-audit -r /tmp/terralyra-runtime-requirements.txt
          else
            echo "No third-party runtime dependencies to audit"
          fi
      - name: Secret-pattern scan
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          files = [
              name
              for name in subprocess.check_output(
                  ["git", "ls-files", "-z"], text=True
              ).split("\0")
              if name and name != ".secrets.baseline"
          ]
          result = subprocess.run(
              ["detect-secrets", "scan", *files],
              check=True,
              capture_output=True,
              text=True,
          )
          report = json.loads(result.stdout)
          baseline = json.loads(Path(".secrets.baseline").read_text())
          allowed = {
              (filename, match["type"], match["hashed_secret"])
              for filename, matches in baseline.get("results", {}).items()
              for match in matches
          }
          unexpected = {
              filename: [
                  match
                  for match in matches
                  if (filename, match["type"], match["hashed_secret"])
                  not in allowed
              ]
              for filename, matches in report.get("results", {}).items()
          }
          unexpected = {
              filename: matches
              for filename, matches in unexpected.items()
              if matches
          }
          if unexpected:
              for filename, matches in unexpected.items():
                  for match in matches:
                      print(f"Potential secret: {filename}:{match['line_number']}")
              raise SystemExit("Potential secrets detected")
          print(
              f"Secret scan passed for {len(files)} tracked files; "
              f"{len(allowed)} reviewed baseline fingerprints allowed"
          )
          PY
